name: astrbot_plugin_remote_task
display_name: 远程任务
desc: opencode 远程任务助手：群里下发任务给 opencode 执行，自动选择 serve API 或本地 run，实时推送进度，支持取消与历史查询
help: |
  在群聊发送以下命令：
  - /任务 <描述>：下发一个新任务（自动探测执行模式）
  - /任务列表：查看最近任务状态
  - /任务详情 <id>：查看任务执行摘要
  - /任务取消 <id>：中止正在运行的任务
  - /任务模式：查看当前执行模式（serve/本地 run）与探测结果
  - /任务 serve 状态|启动|停止：管理 opencode serve 后台进程
  管理命令（下发/取消/serve 管理）仅限配置的 admin_umos 白名单。
  run_work_dir 为必填配置，未配置时拒绝下发任务。
version: 1.2.0
author: yunxiao258
repo: https://github.com/yunxiao258/astrbot_plugin_remote_task
